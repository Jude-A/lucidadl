name: Nix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nix.yml
      - flake.nix
      - flake.lock
      - nix/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and run Nix package (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The packaging is introduced separately in PR #10.
      - name: Report missing Nix packaging
        if: hashFiles('flake.nix') == ''
        run: echo "Nix packaging is not present in this revision; build skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Nix
        if: hashFiles('flake.nix') != ''
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build the published release package
        if: hashFiles('flake.nix') != ''
        run: |
          test -f flake.lock || { echo "Please commit flake.lock before building in CI."; exit 1; }
          nix build --no-update-lock-file --print-build-logs
      - name: Check command entry points
        if: hashFiles('flake.nix') != ''
        run: |
          ./result/bin/lucidadl --help
          ./result/bin/lucida --help
