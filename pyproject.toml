[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lucidadl"
version = "1.4.0"
description = "Fast, parallel CLI music downloader for lucida.to with resilient public playlist imports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jude-A" }]
keywords = [
    "music", "downloader", "lucida", "qobuz", "amazon", "apple-music",
    "spotify", "deezer", "youtube-music", "tidal", "soundcloud", "playlist",
    "flac", "cli", "tui",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40",
    "click>=8.1",
    "httpx[http2]>=0.27",
    "pyjson5>=1.6",
    "imageio-ffmpeg>=0.4",
    "mutagen>=1.45",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
lucida = "lucidadl.cli:cli"
lucidadl = "lucidadl.cli:cli"

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/Jude-A/lucidadl"
Repository = "https://github.com/Jude-A/lucidadl"
Issues = "https://github.com/Jude-A/lucidadl/issues"
Changelog = "https://github.com/Jude-A/lucidadl/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["lucidadl"]
